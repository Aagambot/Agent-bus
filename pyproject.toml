[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbus"
version = "0.1.0"
description = "A shared, searchable memory bus for multi-agent LangGraph/LangChain systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.1,<1.0",
]
langchain = [
    "langchain-core>=0.1",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
eval = [
    "langgraph>=0.1,<1.0",
]
all = [
    "langgraph>=0.1,<1.0",
    "langchain-core>=0.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
